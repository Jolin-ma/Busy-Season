<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legacy Link — Coming Soon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400;1,600&display=swap"
        rel="stylesheet">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #e8ded0;
            color: #232323;
            font-family: 'Space Mono', monospace;
            font-size: 1em;
            line-height: 1.4;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .nav-link {
            font-size: 0.72rem;
            letter-spacing: 0.18em;
            color: #232323;
            text-transform: uppercase;
            transition: opacity 0.2s;
        }

        .nav-link:hover {
            opacity: 0.4;
        }

        /* ── FADE-IN STAGES ── */
        @keyframes fade-up {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .reveal {
            opacity: 0;
            animation: fade-up 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        .reveal-1 { animation-delay: 0.1s; }
        .reveal-2 { animation-delay: 0.32s; }
        .reveal-3 { animation-delay: 0.54s; }
        .reveal-4 { animation-delay: 0.76s; }
        .reveal-5 { animation-delay: 1.0s; }

        /* ── BLINK CURSOR ── */
        @keyframes cursor-blink {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0; }
        }
        .cursor {
            display: inline-block;
            width: 2px;
            height: 1em;
            background: #232323;
            margin-left: 3px;
            vertical-align: middle;
            animation: cursor-blink 1.1s step-end infinite;
        }

        /* ── BACK LINK ── */
        .back-link {
            font-size: 0.65rem;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(35,35,35,0.35);
            padding-bottom: 1px;
            transition: opacity 0.2s, border-color 0.2s;
        }
        .back-link:hover {
            opacity: 0.5;
        }
    </style>
</head>

<body>

    <!-- ═══════════════════════════════ HEADER ═══════════════════════════════ -->
    <header style="
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 36px 44px;
        border-bottom: 1px solid rgba(35,35,35,0.10);
    ">
        <!-- Left nav -->
        <nav style="display:flex; gap:40px; align-items:center; flex:1;">
            <a href="packages.html" class="nav-link">Our Packages</a>
            <a href="monuments.html" class="nav-link">Monuments</a>
            <a href="pet-memorials.html" class="nav-link">Pet Memorials</a>
        </nav>

        <!-- Centre logo -->
        <a href="index.html" style="position:absolute; left:50%; transform:translateX(-50%);">
            <img src="image/legacy_link_logo.png" alt="Legacy Link" style="height:64px; width:auto; display:block;" />
        </a>

        <!-- Right — placeholder to balance flex -->
        <div style="flex:1;"></div>
    </header>


    <!-- ═══════════════════════════════ MAIN ═══════════════════════════════ -->
    <main style="
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 80px 44px;
        text-align: center;
    ">

        <!-- Ruled top line -->
        <div class="reveal reveal-1" style="width:1px; height:72px; background:rgba(35,35,35,0.18); margin-bottom:48px;"></div>

        <!-- Eyebrow -->
        <p class="reveal reveal-2" style="
            font-size: 0.6rem;
            letter-spacing: 0.38em;
            text-transform: uppercase;
            opacity: 0.45;
            margin-bottom: 28px;
        ">Account Creation</p>

        <!-- Main headline -->
        <h1 class="reveal reveal-3" style="
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(3rem, 8vw, 6.5rem);
            font-weight: 300;
            font-style: italic;
            line-height: 1.0;
            letter-spacing: -0.01em;
            margin-bottom: 40px;
            max-width: 760px;
        ">This chapter is<br>still being written.</h1>

        <!-- Ruled divider -->
        <div class="reveal reveal-3" style="
            width: 48px;
            height: 1px;
            background: rgba(35,35,35,0.30);
            margin-bottom: 40px;
        "></div>

        <!-- Body copy -->
        <p class="reveal reveal-4" style="
            font-size: 0.7rem;
            letter-spacing: 0.08em;
            line-height: 2.0;
            opacity: 0.55;
            max-width: 420px;
            margin-bottom: 14px;
        ">
            Account creation is currently under construction.<span class="cursor"></span>
        </p>
        <p class="reveal reveal-4" style="
            font-size: 0.7rem;
            letter-spacing: 0.08em;
            line-height: 2.0;
            opacity: 0.40;
            max-width: 420px;
            margin-bottom: 64px;
        ">
            The full platform is in active development.<br>
            Check back soon.
        </p>

        <!-- Back link -->
        <a href="index.html" class="back-link reveal reveal-5">← Return home</a>

        <!-- Ruled bottom line -->
        <div class="reveal reveal-5" style="width:1px; height:72px; background:rgba(35,35,35,0.18); margin-top:64px;"></div>

    </main>


    <!-- ═══════════════════════════════ FOOTER ═══════════════════════════════ -->
    <footer style="
        padding: 28px 44px;
        border-top: 1px solid rgba(35,35,35,0.10);
        display: flex;
        justify-content: space-between;
        align-items: center;
    ">
        <span style="font-size:0.58rem; letter-spacing:0.16em; opacity:0.30; text-transform:uppercase;">
            © 2025 Legacy Link
        </span>
        <span style="font-size:0.58rem; letter-spacing:0.16em; opacity:0.30; text-transform:uppercase;">
            Platform in development
        </span>
    </footer>

</body>
</html>
